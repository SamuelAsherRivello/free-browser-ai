[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?project_ref=jxaqvzmmtfbpsshkzapc&features=database%2Cdebugging%2Cdevelopment"
enabled = true
required = false
enabled_tools = [
  "list_tables",
  "list_extensions",
  "list_migrations",
  "apply_migration",
  "execute_sql",
  "query_logs",
  "get_advisors",
  "get_project_url",
  "get_publishable_keys",
  "generate_typescript_types",
]
default_tools_approval_mode = "writes"
startup_timeout_sec = 20
tool_timeout_sec = 60
